version: '3.9'

services:
  # ---- PostgreSQL Database ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: boloyaarai
      POSTGRES_USER: boloyaarai_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boloyaarai_user -d boloyaarai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Django Backend ----
  django:
    build:
      context: ./backend/django_app
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/django_app/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/django_app:/app
      - django_static:/app/staticfiles
      - django_media:/app/media
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn boloyaarai_project.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 300"

  # ---- Flask AI Microservice ----
  flask_ai:
    build:
      context: ./backend/flask_ai
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/flask_ai/.env
    ports:
      - "5000:5000"
    volumes:
      - ./backend/flask_ai:/app
      - whisper_models:/root/.cache/huggingface
    # Note: Ollama must be running on the host. Use host.docker.internal
    # on Mac/Windows, or configure network_mode: host on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python app.py

volumes:
  postgres_data:
  django_static:
  django_media:
  whisper_models:
