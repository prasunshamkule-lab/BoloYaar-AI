# BoloYaar AI — Nginx Configuration
# Place this in /etc/nginx/sites-available/boloyaarai
# Then: ln -s /etc/nginx/sites-available/boloyaarai /etc/nginx/sites-enabled/

upstream django_backend {
    server 127.0.0.1:8000;
}

upstream flask_ai_service {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL — use certbot to generate these
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Client upload limit (for audio files)
    client_max_body_size 50M;

    # ---- PWA Frontend ----
    root /var/www/boloyaarai/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # PWA caching headers
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location = /sw.js {
            expires 0;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ---- Django API ----
    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout for long AI requests
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }

    # ---- Django Static & Media ----
    location /static/ {
        alias /var/www/boloyaarai/backend/django_app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/boloyaarai/backend/django_app/media/;
    }

    # ---- Flask AI (internal access only via Django) ----
    # Flask is NOT exposed directly to the internet.
    # Django forwards requests to Flask internally.
    # If you need to expose Flask for debugging, add a location here
    # and protect it with auth.

    # ---- Admin ----
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
